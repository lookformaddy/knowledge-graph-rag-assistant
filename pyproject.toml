[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-rag-assistant"
version = "0.1.0"
description = "Knowledge Graph-Powered RAG Assistant (GraphRAG): hybrid chunk + multi-hop graph retrieval with path-level citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GraphRAG Contributors" }]
keywords = ["graphrag", "knowledge-graph", "rag", "retrieval", "fastapi"]
dependencies = [
    "networkx>=3.2",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
