# GitHub Actions CI for knowledge-graph-rag-assistant.
#
# NOTE: This file lives under docs/ as a reference. To activate it, move it to
# .github/workflows/ci.yml in the repository root.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest -q

      - name: Run comparison eval (chunk-only vs hybrid)
        run: python eval/run_eval.py

      - name: Smoke-test the demo
        run: python examples/demo.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t knowledge-graph-rag-assistant .
